[package]
name = "share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
capture.workspace = true
encode.workspace = true
channels.workspace = true
decode.workspace = true
viewer.workspace = true
net.workspace = true
stats.workspace = true
# timeBeginPeriod and timeEndPeriod: a 1 ms timer while a share runs, so the
# last frame before the screen goes still is not held up to 15 ms longer.
windows-sys = { workspace = true, features = ["Win32_Media"] }

[features]
# Tests only (room's tests turn it on): src/fault.rs, which gives the test
# pattern a pointer that moves with its pictures, holds some pictures back,
# keeps what a viewer drew for the pointers it held, reads what waits in a
# viewer's inbox, pauses the pattern as a monitor's capture pauses, and brings
# it a monitor's new mode. A release build never has it.
fault = []

[dev-dependencies]
# tests/sharer.rs, tests/window.rs and the tests in src/sharer.rs make the
# encoders stall, fail, not open and not offer HEVC.
encode = { workspace = true, features = ["fault"] }
# The tests in src/sharer.rs say what a look at the desktop finds.
capture = { workspace = true, features = ["fault"] }
# tests/viewer_resize.rs makes the viewer's resizes fail.
viewer = { workspace = true, features = ["fault"] }
# tests/window.rs makes the window it shares.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
