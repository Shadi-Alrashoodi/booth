[package]
name = "encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
annexb.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[features]
# Tests only (share's and room's tests turn it on): the faults in
# src/fault.rs, which let a test make a real Media Foundation hardware
# encoder stop asking for frames, and a real NVENC or software encoder fail a
# frame. A release build never has it.
fault = []

[build-dependencies]
cc.workspace = true

[dev-dependencies]
# The leak test in tests/mf_leaks.rs reads handle count, thread count and
# private bytes of the test process.
windows = { workspace = true, features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
