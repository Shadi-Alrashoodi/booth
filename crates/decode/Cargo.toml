[package]
name = "decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
annexb.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
capture.workspace = true
encode.workspace = true
proptest.workspace = true
# Handle and GDI counts for the leak test, System32's path for the planted
# DLL test, committed memory for what refusing an oversized HEVC picture
# costs.
windows = { workspace = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
