[package]
name = "room"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
share.workspace = true
keys.workspace = true
invite.workspace = true
session.workspace = true
channels.workspace = true
stats.workspace = true
net.workspace = true
voice.workspace = true
crossbeam-channel.workspace = true
getrandom.workspace = true
zeroize.workspace = true
# Which chars are combining marks, for the cut in control::clean.
unicode-bidi.workspace = true

[dev-dependencies]
proptest.workspace = true
# tests/video.rs makes NVENC fail a frame during a share.
encode = { workspace = true, features = ["fault"] }
# tests/sound.rs says what a window share's look at the desktop finds.
capture = { workspace = true, features = ["fault"] }
# tests/common/window.rs makes the windows tests/video.rs shares;
# examples/share_numbers.rs reads a window's bounds from DWM.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }
